[tool.poetry]
package-mode = false
name = "Nebus-test-task"
version = "0.1.0"
description = ""
authors = ["Vitaly Grishyk <vitaly.zhidovitch@gmail.com>"]
readme = "README.md"

[tool.poetry.group.profiler]
optional = true

[tool.poetry.group.pre-commit]
optional = true

[tool.poetry.group.tests]
optional = true

[tool.poetry.dependencies]
python = "^3.13"

python-multipart = "0.0.22"
aio-pika = "9.6.1"
faststream = {extras = ["rabbit"], version = "0.7.5"}

fastapi = "0.135.0"
uvicorn = "0.41.0"

aiohttp = "3.13.3"
aiofiles = "25.1.0"
requests = "2.32.5"

python-dotenv = "1.2.1"
pydantic-settings = "2.13.1"

pydantic = {extras = ["email"], version = "^2.12.5"}

sqlalchemy = "2.0.46"
alembic = "1.20.0"

psycopg2-binary = "2.9.11"
asyncpg = "0.31.0"

redis = "7.2.1"

PyJWT = "2.11.0"
bcrypt = "5.0.0"
cryptography = "46.0.5"

loguru = "0.7.3"
orjson = "3.11.7"

[tool.poetry.group.profiler.dependencies]
py-spy = "0.4.1"
memray = "1.19.1"
gprof2dot = "2025.4.14"
yappi = "1.7.3"

[tool.poetry.group.pre-commit.dependencies]
pre-commit = "^4.5.1"
autopep8 = "^2.3.2"
pyright = "^1.1.408"
ruff = "^0.15.2"

[tool.poetry.group.tests.dependencies]
pytest = "9.0.2"
pytest-mock = "3.15.1"
pytest-sugar = "1.1.1"
pytest-asyncio = "1.3.0"
pytest-cov = "7.0.0"
pytest-dotenv = "0.5.2"
httpx = "0.28.1"

[tool.ruff]
target-version = "py314"
preview = true
line-length = 120

[tool.autopep8]
max_line_length = 120
in-place = true
recursive = true
aggressive = 2
exclude = ".git,__pycache__,.venv"

[tool.ruff.lint]
select = ["E", "W", "F", "N", "ANN"]
ignore = ["ANN003", "ANN002"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ["tests"]
addopts = "-ra -q"
python_files = ["test_*.py", "*_test.py"]
env_files = ".env_test"
filterwarnings = 'ignore'

